# Klest configuration — example (ADR 0007).
#
# Copy to $XDG_CONFIG_HOME/klest/config.toml (usually ~/.config/klest/config.toml),
# or point $KLEST_CONFIG at a file of your choice. Every key is optional: Klest
# works out of the box, and this file only overrides the defaults you set. The
# values below are the built-in defaults.

[appearance]
# Background colour of empty outputs, as "#rrggbb" or "#rrggbbaa".
background_color = "#1a1c29"

[keyboard]
# Key repeats per second, and the delay (ms) before repeating starts.
repeat_rate = 25
repeat_delay = 600

[keybindings]
# Command launched on Alt+Return. Empty by default (the binding does nothing);
# set it to a terminal you have installed, e.g. "foot" or "alacritty".
terminal = ""
