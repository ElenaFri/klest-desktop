# Klest configuration — example (ADR 0007).
#
# Copy to $XDG_CONFIG_HOME/klest/config.toml (usually ~/.config/klest/config.toml),
# or point $KLEST_CONFIG at a file of your choice. Every key is optional. This
# example starts Klest's bundled session components; customize it as needed.

[appearance]
# Background colour of empty outputs, as "#rrggbb" or "#rrggbbaa".
background_color = "#1a1c29"

[keyboard]
# Key repeats per second, and the delay (ms) before repeating starts.
repeat_rate = 25
repeat_delay = 600

[keybindings]
# Command launched on Alt+Return. The Klest package installs foot by default.
terminal = "foot"
# Command launched on Alt+Space. The bundled launcher is ready to use.
launcher = "klest-launcher"

[startup]
# Commands launched once, after the compositor is up. The defaults below bring
# up a full session; empty them (autostart = []) to run the compositor bare.
# When running from a build tree, use paths like "./build/src/klest-background".
autostart = ["klest-background", "klest-panel", "klest-notify"]
