# SonarQube / SonarCloud configuration for Klest.
#
# Vendored third-party code, build directories and Meson subprojects are not
# held to Klest's own quality standards: exclude them from analysis so the
# dashboard only reflects code we actually maintain.

sonar.exclusions=third_party/**,build/**,build-*/**,subprojects/**
sonar.cpd.exclusions=third_party/**
